<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Halı Saha Kadro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #171717;
    --card: #222222;
    --border: #2e2e2e;
    --border-soft: #262626;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --faint: #6b6b6b;
    --chip: #2a2a2a;
    --danger: #ef4444;
    --accent: #e6ff3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 60%),
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px) 0 0 / 28px 28px,
      var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { width: 14px; height: 14px; flex: none; }

  .wrap { max-width: 1260px; margin: 0 auto; padding: 24px 12px 48px; }
  header { text-align: center; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 16px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--chip);
    border-radius: 999px; padding: 6px 13px; color: var(--muted);
  }
  .pill b { color: var(--text); }
  .meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 16px 0 24px; }
  .meta .pill { color: var(--text); font-weight: 600; text-decoration: none; padding: 8px 13px; }
  .meta .pill.ghost { background: transparent; color: var(--muted); font-weight: 500; }
  .meta .pill.ghost:hover, .meta a.pill:hover { border-color: #444; }

  .add { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
  .add input {
    width: min(348px, 100%); flex: 0 1 348px;
    background: #1f1f1f; border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 16px; font: inherit; font-size: 15px; outline: none;
  }
  .add input:focus { border-color: #555; }
  .add button {
    display: inline-flex; align-items: center; gap: 6px;
    background: #2a2a2a; border: 1px solid var(--border); border-radius: 10px;
    padding: 0 18px; font-weight: 600; color: var(--muted);
  }
  .add button:not(:disabled) { color: var(--text); background: #333; }
  .add button:disabled { cursor: default; }
  .add button svg { width: 16px; height: 16px; }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .board { grid-template-columns: 1fr; } }

  .col { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .col-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: 15px;
  }
  .col-head.empty { color: var(--faint); }
  .col-head svg { width: 16px; height: 16px; color: var(--muted); }
  .count { background: var(--chip); color: var(--muted); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
  .col-head .clear {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
    background: none; border: 0; color: var(--danger); font-size: 12px; font-weight: 500;
  }
  .col-head .clear svg { width: 12px; height: 12px; color: var(--danger); }

  .list { padding: 12px; display: flex; flex-direction: column; gap: 9px; min-height: 120px; }
  .board.has-players .list { min-height: 420px; }
  .dropzone {
    flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
    border: 1px dashed #333; border-radius: 10px; color: var(--muted); font-size: 13px; padding: 24px;
  }
  .list.over { background: rgba(255,255,255,0.03); }
  .list.over .dropzone { border-color: #666; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card.dragging { opacity: 0.4; }
  .card-top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: grab; font-weight: 600; font-size: 15px; }
  .card-top:active { cursor: grabbing; }
  .card-top .grip { color: var(--faint); }
  .card-top .name { overflow-wrap: anywhere; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border-soft); }
  .actions button {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    background: none; border: 0; padding: 10px 4px; font-size: 12px; font-weight: 600;
  }
  .actions button + button { border-left: 1px solid var(--border-soft); }
  .actions button:hover { background: rgba(255,255,255,0.04); }
  .actions svg { width: 12px; height: 12px; }
  .actions .del { color: var(--danger); font-weight: 500; }

  .msg { text-align: center; color: var(--danger); margin: -12px 0 16px; font-size: 13px; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; width: min(380px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog h2 { margin: 0 0 16px; font-size: 17px; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  dialog input {
    width: 100%; background: #1f1f1f; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font: inherit; outline: none;
  }
  dialog .row { display: flex; gap: 8px; }
  dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  dialog .btns button { border: 1px solid var(--border); background: var(--chip); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
  dialog .btns .primary { background: var(--text); color: #111; border-color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Halı Saha Kadro</h1>
    <span class="pill">Toplam oyuncu: <span><b id="total">0</b>/<span id="max">16</span></span></span>
    <div class="meta">
      <span class="pill" id="timePill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span id="timeText"></span></span>
      <a class="pill" id="locPill" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Konum<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
      <button class="pill ghost" id="editBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>Düzenle</button>
    </div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <input id="nameInput" placeholder="Oyuncu adı..." maxlength="40" />
    <button id="addBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Ekle</button>
  </form>

  <p class="msg" id="msg" hidden></p>
  <main class="board" id="board"></main>
</div>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h2>Maç bilgileri</h2>
    <div class="row">
      <div style="flex:1"><label for="fStart">Başlangıç</label><input id="fStart" type="time" /></div>
      <div style="flex:1"><label for="fEnd">Bitiş</label><input id="fEnd" type="time" /></div>
    </div>
    <label for="fLoc">Konum linki (Google Maps vb.)</label>
    <input id="fLoc" type="url" placeholder="https://maps.google.com/..." />
    <label for="fMax">Maksimum oyuncu</label>
    <input id="fMax" type="number" min="2" max="40" />
    <div class="btns">
      <button value="cancel" formnovalidate>Vazgeç</button>
      <button value="save" class="primary">Kaydet</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  const ICON = {
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="19" r="1.6"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>'
  };
  const COLS = [
    { id: 'none', title: 'Atanmamış' },
    { id: 'A', title: 'Takım A' },
    { id: 'B', title: 'Takım B' }
  ];

  let state = { players: [], start: '21:00', end: '22:00', loc: 'https://maps.google.com', max: 16 };
  let loaded = false, busy = 0, lastJson = '';

  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function showMsg(text) {
    const m = $('msg');
    m.textContent = text || '';
    m.hidden = !text;
  }
  function apply(data) {
    const j = JSON.stringify(data);
    loaded = true;
    if (j === lastJson) return;
    lastJson = j;
    state = data;
    render();
  }
  // --- Veritabanı (Upstash Redis). Bu anahtar SADECE halisaha:* listesine erişebilir. ---
  const DB_URL = 'https://generous-platypus-151340.upstash.io';
  const DB_TOKEN = 'gwAAAAAAAk8sAAIIQHAxaGFsaXNhaGEJiNCgSUAge82_IJUo3CQrxEhrUlNLrWgCi6JbqfHtzY38aLZCmTJ8k7r2OLtGI4kI28ONadBvBLhHAhTrdaMp';
  const P = 'halisaha:players', S = 'halisaha:settings';
  const DEFAULTS = { start: '21:00', end: '22:00', loc: 'https://maps.google.com', max: '16' };
  const TEAMS = ['none', 'A', 'B'];

  class UserError extends Error {}
  async function redis(cmds) {
    const r = await fetch(DB_URL + '/pipeline', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + DB_TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify(cmds)
    });
    if (!r.ok) throw new Error('db ' + r.status);
    const out = await r.json();
    return out.map(x => { if (x.error) throw new Error(x.error); return x.result; });
  }
  const toObj = arr => { const o = {}; for (let i = 0; i < arr.length; i += 2) o[arr[i]] = arr[i + 1]; return o; };
  const clean = (v, n) => String(v == null ? '' : v).trim().replace(/\s+/g, ' ').slice(0, n);

  async function readState() {
    const [pRaw, sRaw] = await redis([['HGETALL', P], ['HGETALL', S]]);
    const players = Object.values(toObj(pRaw || []))
      .map(v => { try { return JSON.parse(v); } catch (e) { return null; } })
      .filter(Boolean)
      .sort((a, b) => a.ts - b.ts);
    const s = Object.assign({}, DEFAULTS, toObj(sRaw || []));
    return { players, start: s.start, end: s.end, loc: s.loc, max: parseInt(s.max, 10) || 16 };
  }

  async function doAction(b) {
    if (b.action === 'add') {
      const name = clean(b.name, 40);
      if (!name) throw new UserError('İsim boş olamaz');
      const [len, maxRaw] = await redis([['HLEN', P], ['HGET', S, 'max']]);
      const max = parseInt(maxRaw || DEFAULTS.max, 10);
      if (len >= max) throw new UserError(`Kadro dolu (${max} oyuncu)`);
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      await redis([['HSET', P, id, JSON.stringify({ id, name, team: 'none', ts: Date.now() })]]);
    } else if (b.action === 'move') {
      if (!TEAMS.includes(b.team)) return;
      const [raw] = await redis([['HGET', P, String(b.id)]]);
      if (raw) {
        const p = JSON.parse(raw);
        p.team = b.team; p.ts = Date.now();
        await redis([['HSET', P, p.id, JSON.stringify(p)]]);
      }
    } else if (b.action === 'remove') {
      await redis([['HDEL', P, String(b.id)]]);
    } else if (b.action === 'clear') {
      const st = await readState();
      const ids = st.players.filter(p => p.team === 'none').map(p => p.id);
      if (ids.length) await redis([['HDEL', P, ...ids]]);
    } else if (b.action === 'settings') {
      const f = [];
      if (/^\d{2}:\d{2}$/.test(b.start)) f.push('start', b.start);
      if (/^\d{2}:\d{2}$/.test(b.end)) f.push('end', b.end);
      if (typeof b.loc === 'string' && (b.loc === '' || /^https?:\/\//i.test(b.loc))) f.push('loc', clean(b.loc, 500));
      const m = parseInt(b.max, 10);
      if (m >= 2 && m <= 40) f.push('max', String(m));
      if (f.length) await redis([['HSET', S, ...f]]);
    }
  }

  async function api(body) {
    busy++;
    try {
      if (body) await doAction(body);
      apply(await readState());
      showMsg(''); return true;
    } catch (e) {
      showMsg(e instanceof UserError ? e.message : 'Bağlantı hatası. İnternetinizi kontrol edin.');
      return false;
    } finally { busy--; }
  }

  function move(id, team) {
    const p = state.players.find(x => x.id === id);
    if (!p || p.team === team) return;
    p.team = team; p.ts = Date.now(); render(); // anında göster
    api({ action: 'move', id, team });
  }
  function remove(id) {
    state.players = state.players.filter(x => x.id !== id); render();
    api({ action: 'remove', id });
  }

  function actionsFor(team) {
    if (team === 'none') return [['A', 'Takım A', ICON.arrow], ['B', 'Takım B', ICON.arrow]];
    if (team === 'A') return [['none', 'Çıkar', ICON.back], ['B', 'Takım B', ICON.arrow]];
    return [['none', 'Çıkar', ICON.back], ['A', 'Takım A', ICON.arrow]];
  }

  function render() {
    $('total').textContent = state.players.length;
    $('max').textContent = state.max;
    $('timeText').textContent = state.start + ' - ' + state.end;
    $('locPill').href = state.loc || '#';
    $('addBtn').disabled = !$('nameInput').value.trim();

    const board = $('board');
    board.classList.toggle('has-players', state.players.length > 0);
    const sorted = state.players.slice().sort((a, b) => a.ts - b.ts);
    board.innerHTML = COLS.map(col => {
      const list = sorted.filter(p => p.team === col.id);
      const head = `<div class="col-head${list.length ? '' : (col.id === 'none' ? '' : ' empty')}">${ICON.users}<span>${col.title}</span><span class="count">${list.length} oyuncu</span>${col.id === 'none' && list.length ? `<button class="clear" data-clear>${ICON.trash}Temizle</button>` : ''}</div>`;
      const cards = list.map(p => `
        <div class="card" draggable="true" data-id="${p.id}">
          <div class="card-top"><span class="grip">${ICON.grip}</span><span class="name">${esc(p.name)}</span></div>
          <div class="actions">
            ${actionsFor(col.id).map(([t, label, ic]) => `<button data-move="${t}" data-id="${p.id}">${ic}${label}</button>`).join('')}
            <button class="del" data-del="${p.id}">${ICON.trash}Sil</button>
          </div>
        </div>`).join('');
      const empty = !loaded ? '<div class="dropzone">Yükleniyor...</div>'
        : col.id === 'none' ? '<div class="dropzone">Oyuncu ekleyin</div>' : '<div class="dropzone">Oyuncu sürükleyin veya gönderin</div>';
      return `<section class="col">${head}<div class="list" data-team="${col.id}">${cards || empty}</div></section>`;
    }).join('');
  }

  // Add player
  $('nameInput').addEventListener('input', () => { $('addBtn').disabled = !$('nameInput').value.trim(); });
  $('addForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('nameInput').value.trim().replace(/\s+/g, ' ');
    if (!name) return;
    $('addBtn').disabled = true;
    const ok = await api({ action: 'add', name });
    if (ok) $('nameInput').value = '';
    $('addBtn').disabled = !$('nameInput').value.trim();
    $('nameInput').focus();
  });

  // Buttons
  $('board').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.move) move(b.dataset.id, b.dataset.move);
    else if (b.dataset.del) remove(b.dataset.del);
    else if ('clear' in b.dataset) {
      if (confirm('Atanmamış oyuncuların hepsi silinsin mi?')) api({ action: 'clear' });
    }
  });

  // Drag & drop (desktop)
  let dragId = null;
  $('board').addEventListener('dragstart', e => {
    const c = e.target.closest('.card'); if (!c) return;
    dragId = c.dataset.id; c.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
  });
  $('board').addEventListener('dragend', e => {
    const c = e.target.closest('.card'); if (c) c.classList.remove('dragging');
    document.querySelectorAll('.list.over').forEach(l => l.classList.remove('over'));
  });
  $('board').addEventListener('dragover', e => {
    const l = e.target.closest('.list'); if (!l || !dragId) return;
    e.preventDefault();
    document.querySelectorAll('.list.over').forEach(x => x !== l && x.classList.remove('over'));
    l.classList.add('over');
  });
  $('board').addEventListener('drop', e => {
    const l = e.target.closest('.list'); if (!l || !dragId) return;
    e.preventDefault();
    const id = dragId; dragId = null;
    move(id, l.dataset.team);
  });

  // Edit dialog
  const dlg = $('editDlg');
  $('editBtn').addEventListener('click', () => {
    $('fStart').value = state.start; $('fEnd').value = state.end;
    $('fLoc').value = state.loc; $('fMax').value = state.max;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  });
  dlg.addEventListener('close', () => {
    if (dlg.returnValue !== 'save') return;
    api({ action: 'settings', start: $('fStart').value, end: $('fEnd').value, loc: $('fLoc').value.trim(), max: $('fMax').value });
  });

  // Başkalarının değişikliklerini görmek için düzenli yenile
  render();
  api();
  setInterval(() => {
    if (document.hidden || busy || dragId || (dlg.open)) return;
    api();
  }, 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) api(); });
})();
</script>
</body>
</html>
